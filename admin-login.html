<style>
:root{
  --yellow:#F6B90A; --yellow-deep:#B8790A; --ink:#221C10; --plum:#3E1750; --plum-deep:#2C0F3A;
  --bg:#FFFCF3; --paper:#FFFFFF; --line: rgba(34,28,16,0.14); --muted:#5b5340;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0; background:var(--bg); color:var(--ink); font-family:'Manrope', sans-serif; font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased; overflow-x:hidden;}
h1,h2,h3,.display{font-family:'Spectral', serif; font-weight:600; line-height:1.1; margin:0; letter-spacing:-0.01em;}
a{color:inherit; text-decoration:none;}
img{max-width:100%; height:auto; display:block;}
.wrap{max-width:1120px; margin:0 auto; padding:0 24px; overflow-wrap:anywhere;}
section{padding:84px 0;}
@media (max-width:640px){ section{padding:52px 0;} }
a:focus-visible, button:focus-visible{ outline:2px solid var(--plum); outline-offset:3px; }
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto;} *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

/* ===== Top navigation (replaces slide-out drawer) ===== */
.topbar{position:sticky; top:0; z-index:40; background:rgba(255,252,243,0.95); backdrop-filter:blur(8px); border-bottom:1px solid var(--line);}
.topbar-inner{max-width:1120px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px;}
.brand{display:flex; align-items:center; gap:10px; flex:none;}
.brand img{width:38px; height:auto;}
.brand-name{font-family:'Spectral', serif; font-size:17px; line-height:1.2;}
.brand-name small{display:block; font-family:'Manrope', sans-serif; font-size:10px; font-weight:700; letter-spacing:0.04em; color:var(--muted); margin-top:1px;}

.navlinks{display:flex; align-items:center; gap:2px; flex-wrap:wrap;}
.navlinks a{padding:9px 13px; font-size:14px; font-weight:600; border-radius:6px; color:var(--ink);}
.navlinks a:hover{background:rgba(34,28,16,0.06);}
.navlinks a.active{color:var(--yellow-deep);}
.navlinks a.pill{background:var(--ink); color:var(--yellow); margin-left:6px;}
.navlinks a.pill:hover{background:var(--plum-deep);}
.navlinks a.admin{border:1px solid var(--line);}

.nav-toggle{display:none; background:var(--ink); border:none; width:40px; height:40px; border-radius:8px; cursor:pointer; align-items:center; justify-content:center; flex:none;}
.nav-toggle .bars{width:18px; height:13px; position:relative;}
.nav-toggle .bars span{position:absolute; left:0; width:100%; height:2px; background:var(--yellow); transition:transform .2s ease, opacity .2s ease;}
.nav-toggle .bars span:nth-child(1){top:0;} .nav-toggle .bars span:nth-child(2){top:5.5px;} .nav-toggle .bars span:nth-child(3){top:11px;}
body.mnav-open .nav-toggle .bars span:nth-child(1){transform:translateY(5.5px) rotate(45deg);}
body.mnav-open .nav-toggle .bars span:nth-child(2){opacity:0;}
body.mnav-open .nav-toggle .bars span:nth-child(3){transform:translateY(-5.5px) rotate(-45deg);}

.mobile-panel{display:none; max-height:0; overflow:hidden; transition:max-height .3s ease; border-top:1px solid var(--line); background:var(--paper);}
body.mnav-open .mobile-panel{max-height:600px;}
.mobile-panel .wrap{padding:10px 24px 18px; display:flex; flex-direction:column;}
.mobile-panel a{padding:13px 4px; font-size:16px; font-weight:600; border-bottom:1px solid var(--line);}
.mobile-panel a:last-child{border-bottom:none;}
.mobile-panel a.active{color:var(--yellow-deep);}

@media (max-width:900px){
  .navlinks{display:none;}
  .nav-toggle{display:flex;}
  .mobile-panel{display:block;}
}

/* Page header banner */
.page-head{background:var(--yellow); padding:52px 0 36px; border-bottom:4px solid var(--ink);}
.page-head .kicker{font-size:13.5px; font-weight:700; color:var(--plum-deep);}
.page-head h1{font-size:clamp(30px,5vw,48px); margin-top:10px; color:var(--ink);}
.page-head p{margin-top:12px; color:#3a2f10; max-width:58ch; font-size:16px;}
.page-head .actions{margin-top:22px;}

.kicker{font-size:14px; color:var(--yellow-deep); font-weight:700;}
.sec-head{max-width:640px; margin-bottom:40px;}
.sec-head h2{font-size:clamp(24px,4vw,34px); margin-top:8px;}
.sec-head p{color:var(--muted); margin-top:12px;}

.btn{padding:12px 22px; border-radius:999px; font-size:14.5px; font-weight:700; display:inline-flex; align-items:center; gap:8px; border:none; cursor:pointer; font-family:'Manrope',sans-serif;}
.btn-primary{background:var(--ink); color:var(--yellow);}
.btn-primary:hover{background:var(--plum-deep); color:#fff;}
.btn-ghost{border:1.5px solid var(--ink); color:var(--ink); background:none;}
.btn-ghost:hover{background:var(--ink); color:var(--yellow);}
.actions{display:flex; gap:12px; flex-wrap:wrap;}

.value-list{display:flex; flex-direction:column;}
.value-row{display:grid; grid-template-columns:48px 1fr; gap:16px; padding:20px 0; border-top:1px solid var(--line);}
.value-row:last-child{border-bottom:1px solid var(--line);}
.value-row .glyph{font-family:'Spectral',serif; font-size:20px; color:var(--yellow-deep); font-weight:700;}
.value-row h3{font-size:17px; font-weight:600;}
.value-row p{margin-top:5px; color:var(--muted); font-size:14.5px;}

.card-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:22px;}
@media (max-width:860px){ .card-grid{grid-template-columns:1fr 1fr;} }
@media (max-width:560px){ .card-grid{grid-template-columns:1fr;} }
.card{border:1px solid var(--line); border-radius:8px; padding:26px; background:var(--paper);}
.card .ic{font-size:26px;}
.card h3{font-size:17px; margin-top:12px;}
.card p{color:var(--muted); font-size:14px; margin-top:8px;}

.num-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); margin-top:8px;}
.num-cell{background:var(--paper); padding:28px 20px;}
.num-cell strong{display:block; font-family:'Spectral',serif; font-size:36px; color:var(--yellow-deep);}
.num-cell span{font-size:12.5px; color:var(--muted);}
@media (max-width:700px){ .num-grid{grid-template-columns:repeat(2,1fr);} }

.prog-item{display:grid; grid-template-columns:100px 1fr; gap:20px; padding:26px 0; border-top:1px solid var(--line); align-items:start;}
.prog-item:last-child{border-bottom:1px solid var(--line);}
.prog-age{font-size:13px; color:var(--yellow-deep); font-weight:700;}
.prog-item h3{font-size:21px; margin-top:2px;}
.prog-item p{color:var(--muted); margin-top:8px; max-width:58ch;}

.news-row{display:grid; grid-template-columns:92px 1fr; gap:20px; padding:22px 0; border-top:1px solid var(--line);}
.news-row:last-child{border-bottom:1px solid var(--line);}
.news-date{font-size:12.5px; color:var(--muted);}
.news-row h3{font-size:17.5px; font-weight:600; font-family:'Spectral',serif;}
.news-row span.cat{font-size:11.5px; color:var(--yellow-deep); font-weight:700;}
.news-row p{color:var(--muted); font-size:14px; margin-top:5px;}

.cta-band{background:var(--plum-deep); color:#f3ecf7; border-radius:6px; padding:48px; margin:0 24px; display:grid; grid-template-columns:1.3fr .7fr; gap:26px; align-items:center;}
.cta-band h2{color:#fff; font-size:clamp(22px,3.4vw,32px);}
.cta-band p{margin-top:10px; color:#c6b3d4;}
@media (max-width:760px){ .cta-band{grid-template-columns:1fr; padding:32px 20px; margin:0 16px;} }

.gallery-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
@media (max-width:640px){ .gallery-grid{grid-template-columns:repeat(2,1fr);} }
.gtile{aspect-ratio:1; min-height:150px; border-radius:4px; position:relative; display:flex; align-items:flex-end; padding:10px; color:#fff; font-size:12.5px; font-weight:700;}
.gtile span{background:rgba(0,0,0,0.35); padding:4px 8px; border-radius:4px;}

.info-grid{display:grid; grid-template-columns:1fr 1fr; gap:36px;}
@media (max-width:800px){ .info-grid{grid-template-columns:1fr;} }
.info-card{border:1px solid var(--line); border-radius:6px; padding:24px; background:var(--paper);}
.info-card h3{font-size:16px; margin-bottom:6px;}
.info-card p{color:var(--muted); font-size:14px;}

.hero-grid{display:grid; grid-template-columns:1.15fr .85fr; gap:44px; align-items:center; padding:56px 0 48px;}
@media (max-width:860px){ .hero-grid{grid-template-columns:1fr; padding:40px 0 36px;} }
.about-grid{display:grid; grid-template-columns:.9fr 1.1fr; gap:48px;}
@media (max-width:860px){ .about-grid{grid-template-columns:1fr;} }
.hero-grid > *, .about-grid > *, .info-grid > *, .cta-band > *, .value-row > *, .prog-item > *, .news-row > *{min-width:0;}

/* filter tabs */
.filter-tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:28px;}
.filter-tabs button{padding:9px 16px; border-radius:999px; border:1px solid var(--line); background:var(--paper); font-size:13.5px; font-weight:600; cursor:pointer; color:var(--ink); font-family:'Manrope',sans-serif;}
.filter-tabs button.active{background:var(--ink); color:var(--yellow); border-color:var(--ink);}

/* level tabs (academics) */
.level-tabs{display:flex; gap:10px; margin-bottom:32px; flex-wrap:wrap;}
.level-tabs button{padding:12px 20px; border-radius:8px; border:1px solid var(--line); background:var(--paper); font-size:14.5px; font-weight:700; cursor:pointer; font-family:'Manrope',sans-serif;}
.level-tabs button.active{background:var(--yellow); border-color:var(--ink);}
.level-panel{display:none;}
.level-panel.active{display:block;}
.tag-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:30px;}
.tag-row span{background:var(--sand,#f0e6c8); border:1px solid var(--line); padding:6px 13px; border-radius:999px; font-size:12.5px; font-weight:600; color:var(--muted);}
.chip-list{display:flex; flex-direction:column; gap:0;}
.chip-list li{list-style:none; padding:12px 0; border-top:1px solid var(--line); font-size:14.5px;}
.chip-list li:first-child{border-top:none;}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:32px; margin-top:8px;}
@media (max-width:800px){ .two-col{grid-template-columns:1fr;} }

/* forms */
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
@media (max-width:700px){ .form-grid{grid-template-columns:1fr;} }
.field{display:flex; flex-direction:column; gap:6px;}
.field.full{grid-column:1/-1;}
.field label{font-size:13.5px; font-weight:700; color:var(--ink);}
.field input, .field select, .field textarea{
  border:1.5px solid var(--line); border-radius:6px; padding:12px 14px; font-family:'Manrope',sans-serif; font-size:15px; background:var(--paper); color:var(--ink); width:100%;
}
.field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--yellow-deep);}
.form-note{font-size:13px; color:var(--muted); margin-top:14px;}
.form-success{display:none; background:#eef7ea; border:1px solid #bcd9a8; color:#2c5a1c; padding:14px 16px; border-radius:6px; font-size:14px; margin-top:16px;}
.form-success.show{display:block;}
.form-error{display:none; background:#fbeaea; border:1px solid #e3a8a8; color:#7a1c1c; padding:14px 16px; border-radius:6px; font-size:14px; margin-top:16px;}
.form-error.show{display:block;}

/* FAQ */
.faq details{border-top:1px solid var(--line); padding:16px 0;}
.faq details:last-child{border-bottom:1px solid var(--line);}
.faq summary{cursor:pointer; font-weight:600; font-size:15.5px; list-style:none; display:flex; justify-content:space-between; align-items:center;}
.faq summary::-webkit-details-marker{display:none;}
.faq summary:after{content:"+"; font-size:20px; color:var(--yellow-deep); font-weight:400;}
.faq details[open] summary:after{content:"\2212";}
.faq p{color:var(--muted); font-size:14.5px; margin-top:10px;}

/* checklist */
.checklist{display:flex; flex-direction:column;}
.checklist li{list-style:none; display:flex; gap:12px; padding:12px 0; border-top:1px solid var(--line); font-size:14.5px; align-items:flex-start;}
.checklist li:first-child{border-top:none;}
.checklist li:before{content:"\2713"; color:var(--yellow-deep); font-weight:800; flex:none;}

table.fees{width:100%; border-collapse:collapse; margin-top:8px;}
table.fees th, table.fees td{text-align:left; padding:14px 12px; border-top:1px solid var(--line); font-size:14.5px;}
table.fees th{font-family:'Spectral',serif; font-size:15px; color:var(--muted); font-weight:600;}
table.fees tr:last-child td{border-bottom:1px solid var(--line);}
.bank-card{background:var(--yellow); border-radius:6px; padding:28px; border:1px solid var(--ink);}
.bank-card h3{font-size:18px;}
.bank-row{display:flex; justify-content:space-between; padding:10px 0; border-top:1px solid rgba(34,28,16,0.2); font-size:14.5px;}
.bank-row:first-of-type{border-top:none;}
.bank-row strong{font-family:'Spectral',serif; font-size:15px;}
.note{font-size:13px; color:var(--plum-deep); margin-top:14px; font-weight:600;}

.hours-table{width:100%; border-collapse:collapse;}
.hours-table td{padding:10px 0; border-top:1px solid var(--line); font-size:14.5px;}
.hours-table td:last-child{text-align:right; color:var(--muted);}

footer{background:var(--ink); color:#cfc7b6; padding:56px 0 24px; margin-top:80px;}
.foot-grid{display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:30px;}
@media (max-width:760px){ .foot-grid{grid-template-columns:1fr 1fr;} }
footer h4{font-family:'Spectral',serif; font-weight:600; font-size:15px; color:var(--yellow); margin-bottom:12px;}
footer .brand-name{color:#fff;}
footer .brand-name small{color:#a89e86;}
footer p{font-size:13.5px; margin-top:12px; max-width:34ch;}
footer ul{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:9px; font-size:13.5px;}
footer ul a:hover{color:#fff;}
.foot-bottom{max-width:1120px; margin:40px auto 0; padding:20px 24px 0; border-top:1px solid rgba(255,255,255,0.1); display:flex; justify-content:space-between; font-size:12px; color:#8a8065; flex-wrap:wrap; gap:10px;}

/* Admin login (standalone, no nav/footer) */
.admin-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(160deg, var(--plum-deep), var(--ink)); padding:24px;}
.admin-card{background:var(--paper); border-radius:10px; padding:40px 34px; width:100%; max-width:400px; box-shadow:0 30px 60px rgba(0,0,0,0.3);}
.admin-card .brand{justify-content:center; margin-bottom:6px;}
.admin-card h1{font-size:22px; text-align:center; margin-top:14px;}
.admin-card .sub{text-align:center; color:var(--muted); font-size:13.5px; margin-top:4px;}
.admin-card form{margin-top:26px; display:flex; flex-direction:column; gap:16px;}
.admin-card .btn-primary{width:100%; justify-content:center; padding:13px;}
.admin-note{background:#fdf3e0; border:1px solid var(--yellow); color:#6b4a05; font-size:12.5px; padding:12px 14px; border-radius:6px; margin-top:20px; text-align:center;}
.admin-back{display:block; text-align:center; margin-top:18px; font-size:13.5px; color:var(--muted);}
</style>

      <h1>Admin Portal</h1>
      <p class="sub">Triumphant Standard Academy &mdash; Secure Administrator Login</p>

      <div id="identityLoggedOut">
        <button id="loginBtn" class="btn btn-primary" style="width:100%; justify-content:center; padding:13px; margin-top:26px;">Sign In to Admin</button>
        <p class="form-note" style="text-align:center;">First time? Ask an existing admin to invite you, or use the button above to sign up if invites are open.</p>
      </div>

      <div id="identityLoggedIn" style="display:none; margin-top:26px; text-align:center;">
        <p id="welcomeMsg" style="font-weight:700;"></p>
        <a href="/admin/" class="btn btn-primary" style="width:100%; justify-content:center; padding:13px; margin-top:10px;">Open Content Manager</a>
        <button id="logoutBtn" class="btn btn-ghost" style="width:100%; justify-content:center; padding:13px; margin-top:10px;">Sign Out</button>
      </div>

      <div class="admin-note">Put your password to login as an Admin.</div>
      <a href="index.html" class="admin-back">&larr; Back to school website</a>
    </div>
  </div>
  <script>
  if (window.netlifyIdentity) {
    var loggedOut = document.getElementById('identityLoggedOut');
    var loggedIn = document.getElementById('identityLoggedIn');
    var welcome = document.getElementById('welcomeMsg');

    function showUser(user){
      loggedOut.style.display = 'none';
      loggedIn.style.display = 'block';
      welcome.textContent = 'Signed in as ' +
        (user.user_metadata && user.user_metadata.full_name
          ? user.user_metadata.full_name
          : user.email);
    }

    function showLoggedOut(){
      loggedOut.style.display = 'block';
      loggedIn.style.display = 'none';
    }

    netlifyIdentity.on('init', function(user){
      if(user) showUser(user);
    });

    netlifyIdentity.on('login', function(user){
      showUser(user);
    });

    netlifyIdentity.on('logout', function(){
      showLoggedOut();
    });

    document.getElementById('loginBtn').addEventListener('click', function(){
      netlifyIdentity.open('login');
    });

    document.getElementById('logoutBtn').addEventListener('click', function(){
      netlifyIdentity.logout();
    });

    netlifyIdentity.on('error', function(err){
      console.error('Netlify Identity error:', err);
    });

    netlifyIdentity.init();
  }
  </script>
